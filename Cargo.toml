[workspace]
members = ["crates/psf", "crates/pkg-fs", "crates/ps3-pkg", "crates/ps4-pkg", "crates/ps4-send", "crates/zarchive", "crates/pkg-ops", "crates/pkg-cli", "crates/pkg-gtk"]
default-members = ["crates/psf", "crates/pkg-fs", "crates/ps3-pkg", "crates/ps4-pkg", "crates/ps4-send", "crates/zarchive", "crates/pkg-ops", "crates/pkg-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "forbid"
