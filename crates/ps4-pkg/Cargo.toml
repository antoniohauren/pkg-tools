[package]
name = "ps4-pkg"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
aes = { version = "=0.9.3", default-features = false }
cbc = { version = "=0.2.1", default-features = false, features = ["block-padding"] }
xts-mode = { version = "=0.6.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
hmac = { version = "=0.13.0", default-features = false }
rsa = { version = "=0.9.10", default-features = false, features = ["std", "u64_digit"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs"] }

[lints]
workspace = true
